# Servidor web (Nginx) del dashboard.
# - Entrega los archivos de src/ (index.html, styles.css, script.js)
# - Lo que empieza con /api/ se lo pasa al contenedor de la API
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API: Nginx las reenvía al servicio "api" de docker-compose
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos de la web
    location / {
        try_files $uri $uri/ /index.html;
    }
}
