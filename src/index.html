<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración general del documento y enlace a la hoja de estilos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado y barra de navegación superior -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Inicio</a></li>
                <li><a href="#tareas">Tareas</a></li>
                <li><a href="#proyectos">Proyectos</a></li>
                <li><a href="#configuracion">Configuración</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido principal de la aplicación web -->
    <main>
        <!-- Sección de bienvenida e introducción al sistema -->
        <section id="home">
            <h1>Sistema de Gestión y Seguimiento de Tareas</h1>
            <p>Bienvenido al Sistema de Gestión de Tareas. Aquí puedes organizar tus tareas y proyectos de manera eficiente.</p>
        </section>

        <!-- Sección dinámica donde se inyectarán las tareas mediante JavaScript -->
        <section id="tareas">
            <h2>Mis Tareas Pendientes</h2>
            <div id="contenedor-tareas"></div>
        </section>

        <!-- Sección de contacto con validación de formularios -->
        <section id="contacto">
            <h2>Contáctanos</h2>
            <form action="">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <!-- Enlace al archivo de lógica y comportamiento (JavaScript) -->
    <script src="script.js"></script>
</body>
</html>
